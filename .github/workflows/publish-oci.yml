name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (default: from tag or 0.1.0)"
        required: false
        default: ""
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"

env:
  LIBUV_VERSION_DEFAULT: "1.51.0"
  PACKAGE_VERSION_DEFAULT: "0.1.0"
  SBCL_VERSION: 2.4.11

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Install build deps (macOS)
        if: matrix.os == 'darwin'
        run: brew install cmake || true

      - name: Install Roswell
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies
        shell: bash
        run: |
          ros install qlot
          qlot install

      - name: Build libuv (Unix)
        if: matrix.os != 'windows'
        env:
          LIBUV_VERSION: ${{ env.LIBUV_VERSION_DEFAULT }}
        run: |
          chmod +x scripts/build-libuv.sh scripts/stage-grovel.sh
          ./scripts/build-libuv.sh
          export EVENT_PROTOCOL_UV_INCLUDE="$(echo build/libuv-*/prefix/include | awk '{print $1}')"
          export HOMEBREW_PREFIX="${HOMEBREW_PREFIX:-/opt/homebrew}"
          ./scripts/stage-grovel.sh event-backend-libuv
          mkdir -p native-bundle/lib native-bundle/grovel
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/lib/
          cp -a "grovel/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/grovel/

      - name: Build libuv (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          LIBUV_VERSION: ${{ env.LIBUV_VERSION_DEFAULT }}
        run: |
          choco install cmake mingw -y
          .\scripts\build-libuv.ps1
          $inc = Get-ChildItem -Path build -Recurse -Directory -Filter include |
            Where-Object { Test-Path (Join-Path $_.FullName "uv.h") } |
            Select-Object -First 1 -ExpandProperty FullName
          "EVENT_PROTOCOL_UV_INCLUDE=$inc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage grovel (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          ./scripts/stage-grovel.sh event-backend-libuv
          mkdir -p native-bundle/lib native-bundle/grovel
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/lib/
          cp -a "grovel/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/grovel/

      - name: Upload native+grovel artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$V" ] && V="${PACKAGE_VERSION_DEFAULT}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: event-backend-libuv
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      description: libuv backend + native/grovel overlays for event-protocol
      license: MIT
      depends-on: cffi event-protocol
      provides: event-backend-libuv
      cffi-libraries: libuv
      source-paths: |
        event-backend-libuv.asd
        src
        LICENSE
        README.md
    secrets: inherit
