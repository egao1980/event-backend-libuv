name: Publish OCI Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (default: from tag or 0.1.0)"
        required: false
        default: ""
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"

env:
  LIBUV_VERSION_DEFAULT: "1.51.0"
  PACKAGE_VERSION_DEFAULT: "0.1.0"
  SBCL_VERSION: 2.4.11
  ROSWELL_VERSION: "26.02.116"
  CL_REPOSITORY_REF: "main"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: amd64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout cl-repository
        uses: actions/checkout@v4
        with:
          repository: egao1980/cl-repository
          ref: ${{ env.CL_REPOSITORY_REF }}
          path: .cl-repository

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl

      - name: Install build deps (macOS)
        if: matrix.os == 'darwin'
        run: brew install cmake || true

      - name: Install Roswell (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell
          mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
          /c/roswell/roswell/ros.exe version

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Bootstrap cl-repository-client (QL deps for client only)
        shell: bash
        run: |
          ros -e '(ql:quickload (quote ("yason" "ironclad" "babel" "dexador" "quri" "chipz" "flexi-streams" "cl-ppcre" "cl-base64" "trivial-features" "salza2" "archive")) :silent t)' -q

      - name: Pull Lisp deps with cl-repository
        shell: bash
        run: |
          export CL_SOURCE_REGISTRY="$(pwd)//:$(pwd)/.cl-repository//:"
          CI_INSTALL_DEPS_ONLY=1 ros -l scripts/ci-test.lisp -q
          echo "CL_SOURCE_REGISTRY=$(pwd)//:$(pwd)/.cl-repository//:$HOME/.local/share/cl-repository/systems//:" >> "$GITHUB_ENV"

      - name: Build libuv (Unix)
        if: matrix.os != 'windows'
        env:
          LIBUV_VERSION: ${{ env.LIBUV_VERSION_DEFAULT }}
        run: |
          chmod +x scripts/build-libuv.sh scripts/stage-grovel.sh
          ./scripts/build-libuv.sh
          export EVENT_PROTOCOL_UV_INCLUDE="$(echo build/libuv-*/prefix/include | awk '{print $1}')"
          export HOMEBREW_PREFIX="${HOMEBREW_PREFIX:-/opt/homebrew}"
          ./scripts/stage-grovel.sh event-backend-libuv
          mkdir -p native-bundle/lib native-bundle/grovel
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/lib/
          cp -a "grovel/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/grovel/

      - name: Build libuv (Windows / MSVC)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          LIBUV_VERSION: ${{ env.LIBUV_VERSION_DEFAULT }}
        run: |
          # cmake/cl from VS Build Tools on the runner — no Chocolatey cmake.
          .\scripts\build-libuv.ps1
          "EVENT_PROTOCOL_UV_INCLUDE=$env:EVENT_PROTOCOL_UV_INCLUDE" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          $lib = Resolve-Path "lib\windows-amd64"
          "EVENT_PROTOCOL_NATIVE=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Path=$lib;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install MinGW for grovel only (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install mingw -y
          $mingw = @(
            "C:\ProgramData\mingw64\mingw64\bin",
            "C:\mingw64\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $mingw) { throw "mingw bin dir not found after choco install" }
          "Path=$mingw;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Stage grovel (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          chmod +x scripts/stage-grovel.sh
          ./scripts/stage-grovel.sh event-backend-libuv
          mkdir -p native-bundle/lib native-bundle/grovel
          cp -a "lib/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/lib/
          cp -a "grovel/${{ matrix.os }}-${{ matrix.arch }}/." native-bundle/grovel/

      - name: Upload native+grovel artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: native-bundle/

  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          fi
          [ -z "$V" ] && V="${PACKAGE_VERSION_DEFAULT}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  publish:
    needs: [build, resolve-version]
    permissions:
      contents: read
      packages: write
    uses: egao1980/cl-repository/.github/workflows/publish-native-package.yml@main
    with:
      package-name: event-backend-libuv
      version: ${{ needs.resolve-version.outputs.version }}
      registry: ${{ inputs.registry || 'ghcr.io' }}
      description: libuv backend + native/grovel overlays for event-protocol
      license: MIT
      depends-on: cffi event-protocol
      provides: event-backend-libuv
      cffi-libraries: libuv
      source-paths: |
        event-backend-libuv.asd
        src
        LICENSE
        README.md
    secrets: inherit
