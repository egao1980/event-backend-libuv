name: Test

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

# Lisp bootstrap mirrors egao1980/cl-repository (install-for-ci → sbcl-bin → qlot).
# Windows: official Roswell zip (install-for-ci needs pacman/MSYS2; see roswell#539).
env:
  SBCL_VERSION: 2.4.11
  ROSWELL_VERSION: "26.02.116"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install libuv (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev build-essential pkg-config

      - name: Install libuv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libuv
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install libuv + toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake mingw -y
          .\scripts\build-libuv.ps1
          $inc = Get-ChildItem -Path build -Recurse -Directory -Filter include |
            Where-Object { Test-Path (Join-Path $_.FullName "uv.h") } |
            Select-Object -First 1 -ExpandProperty FullName
          "EVENT_PROTOCOL_UV_INCLUDE=$inc" | Out-File -FilePath $env:GITHUB_ENV -Append
          $lib = Resolve-Path "lib\windows-amd64"
          "EVENT_PROTOCOL_NATIVE=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Path=$lib;C:\ProgramData\mingw64\mingw64\bin;$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Roswell (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install Roswell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sL "https://github.com/roswell/roswell/releases/download/v${ROSWELL_VERSION}/roswell_${ROSWELL_VERSION}_amd64.zip" \
            -o /tmp/roswell.zip
          rm -rf /c/roswell
          mkdir -p /c/roswell
          unzip -qo /tmp/roswell.zip -d /c/roswell
          echo "/c/roswell/roswell" >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"
          /c/roswell/roswell/ros.exe version

      - name: Install SBCL
        shell: bash
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"

      - name: Install dependencies
        shell: bash
        run: |
          ros install qlot
          qlot install

      - name: Conformance × libuv
        shell: bash
        run: |
          export HOMEBREW_PREFIX="${HOMEBREW_PREFIX:-/opt/homebrew}"
          qlot exec ros -e '(asdf:test-system "event-backend-libuv")'
